(()=>{'use strict';const M=[['パパ','#2d3748'],['ママ','#e53e3e'],['和真','#3182ce'],['晴人','#38a169'],['実央','#dd6b20']],P=['頭','アゴ','首','肩','腕','手','肩甲骨','背中','腰','おしり','太もも','ふくらはぎ','足の裏'],K='magBalmCareLogs_v1';let logs=load(),who='ママ',parts=new Set(),cursor=new Date(),picked='',range='month';const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)],esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),col=n=>(M.find(x=>x[0]===n)||['','#777'])[1];function load(){try{return JSON.parse(localStorage.getItem(K)||'[]')}catch{return[]}}function store(){localStorage.setItem(K,JSON.stringify(logs))}function inputDate(d=new Date()){let p=n=>String(n).padStart(2,'0');return`${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}T${p(d.getHours())}:${p(d.getMinutes())}`}function key(v){let d=new Date(v),p=n=>String(n).padStart(2,'0');return`${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}`}function say(s){let t=$('#toast');t.textContent=s;t.classList.add('show');clearTimeout(t.x);t.x=setTimeout(()=>t.classList.remove('show'),1600)}
function members(){$('#members').innerHTML=M.map(([n,c])=>`<button class="member ${n===who?'on':''}" style="--c:${c}" data-w="${n}"><i style="background:${c}"></i>${n}</button>`).join('');$$('[data-w]').forEach(b=>b.onclick=()=>{who=b.dataset.w;members()})}function renderParts(){$('#chips').innerHTML=P.map(p=>`<button class="chip ${parts.has(p)?'on':''}" data-chip="${p}">${p}</button>`).join('');$$('[data-chip]').forEach(b=>b.onclick=()=>toggle(b.dataset.chip));$$('.part').forEach(x=>x.classList.toggle('sel',parts.has(x.dataset.p)))}function toggle(p){parts.has(p)?parts.delete(p):parts.add(p);renderParts()}$$('svg.body').forEach(s=>[...s.querySelectorAll('.part')].forEach(x=>{let z=x.cloneNode(true);z.setAttribute('class','tap');s.appendChild(z)}));$$('.tap').forEach(x=>x.onclick=()=>toggle(x.dataset.p));$('#dt').value=inputDate();members();renderParts();
$('#save').onclick=()=>{if(!$('#dt').value)return say('日時を入力してください');if(!parts.size)return say('部位を選択してください');logs.push({id:Date.now().toString(36)+Math.random().toString(36).slice(2),member:who,datetime:new Date($('#dt').value).toISOString(),parts:[...parts],memo:$('#memo').value.trim()});store();parts.clear();$('#memo').value='';$('#dt').value=inputDate();renderParts();all();say('保存しました')};
function card(l){let d=new Date(l.datetime);return`<div class="log"><i class="stripe" style="background:${col(l.member)}"></i><div><div class="lh">${esc(l.member)}</div><div class="lm">${d.toLocaleDateString('ja-JP')} ${d.toLocaleTimeString('ja-JP',{hour:'2-digit',minute:'2-digit'})}</div><div class="parts">${l.parts.map(esc).join('・')}</div>${l.memo?`<div class="note">${esc(l.memo)}</div>`:''}</div><button class="del" data-del="${l.id}">削除</button></div>`}function dels(){$$('[data-del]').forEach(b=>b.onclick=()=>{if(confirm('この記録を削除しますか？')){logs=logs.filter(x=>x.id!==b.dataset.del);store();all();say('削除しました')}})}function history(){let a=[...logs].sort((a,b)=>new Date(b.datetime)-new Date(a.datetime));$('#history').innerHTML=a.length?a.map(card).join(''):'<div class="empty">まだ記録がありません</div>';dels()}

function tab(n){$$('.tab').forEach(x=>x.classList.toggle('on',x.dataset.tab===n));$$('.view').forEach(x=>x.classList.remove('active'));$('#'+n+'View').classList.add('active');$('#title').textContent={record:'施術を記録',calendar:'カレンダー',analysis:'ケア分析',history:'施術履歴'}[n];all();scrollTo(0,0)}$$('.tab').forEach(b=>b.onclick=()=>tab(b.dataset.tab));function download(name,type,text){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type}));a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),500)}$('#csv').onclick=()=>{let q=v=>'"'+String(v??'').replace(/"/g,'""')+'"',rows=[['日時','対象者','部位','メモ'],...logs.map(l=>[new Date(l.datetime).toLocaleString('ja-JP'),l.member,l.parts.join('・'),l.memo])];download('mag-balm-records.csv','text/csv','\ufeff'+rows.map(r=>r.map(q).join(',')).join('\r\n'))};$('#backup').onclick=()=>download('mag-balm-backup.json','application/json',JSON.stringify({version:4,logs},null,2));$('#restore').onclick=()=>$('#file').click();$('#file').onchange=async e=>{try{let j=JSON.parse(await e.target.files[0].text()),a=Array.isArray(j)?j:j.logs;if(!Array.isArray(a))throw 0;if(confirm(`${a.length}件で置き換えますか？`)){logs=a;store();all();say('復元しました')}}catch{say('対応していないファイルです')}e.target.value=''};$('#clear').onclick=()=>{if(logs.length&&confirm('全記録を削除しますか？')){logs=[];store();all()}};function all(){history();calendar();analysis()}all();if('serviceWorker'in navigator)addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));})();
