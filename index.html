<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#0b0d12">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<title>マグバーム管理</title>
<style>
:root{--bg:#080a0e;--panel:#12151c;--panel2:#191d26;--line:#282e3a;--text:#f7f8fb;--muted:#9299a8;--accent:#d9ff45;--danger:#ff5c62;--safe:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue","Hiragino Sans","Yu Gothic",sans-serif}body{min-height:100vh}button,input,textarea{font:inherit}.app{max-width:620px;margin:auto;min-height:100vh;padding-bottom:calc(88px + var(--safe))}header{padding:calc(18px + env(safe-area-inset-top,0px)) 20px 12px;position:sticky;top:0;background:linear-gradient(#080a0ef2,#080a0ed9);backdrop-filter:blur(15px);z-index:10;border-bottom:1px solid #171a21}.brand{font-size:11px;letter-spacing:.24em;color:var(--accent);font-weight:800}.title{font-size:24px;font-weight:800;margin-top:5px}.view{display:none;padding:16px 16px 24px}.view.active{display:block}.card{background:linear-gradient(145deg,#151922,#10131a);border:1px solid var(--line);border-radius:20px;padding:16px;margin-bottom:14px;box-shadow:0 12px 30px #0005}.section-title{font-size:12px;color:var(--muted);font-weight:750;letter-spacing:.08em;margin-bottom:12px}.members{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}.member{border:1px solid var(--line);background:#0d1016;color:#fff;border-radius:14px;padding:10px 2px;font-size:12px;font-weight:700}.member .dot{display:block;width:12px;height:12px;border-radius:50%;margin:0 auto 7px}.member.active{border-color:var(--mc);box-shadow:0 0 0 1px var(--mc),0 0 18px color-mix(in srgb,var(--mc) 35%,transparent);background:color-mix(in srgb,var(--mc) 13%,#0d1016)}label{font-size:12px;color:var(--muted);font-weight:700;display:block;margin:0 0 7px}input[type=datetime-local],textarea{width:100%;border:1px solid var(--line);border-radius:13px;background:#0c0f14;color:#fff;padding:13px;outline:none}textarea{min-height:86px;resize:vertical}.body-wrap{display:grid;grid-template-columns:1fr;gap:14px}.body-card{text-align:center;background:#0c0f14;border:1px solid var(--line);border-radius:16px;padding:8px}.body-card small{color:var(--muted)}svg{width:100%;height:420px;overflow:visible;touch-action:manipulation}.tap-zone{fill:transparent;stroke:transparent;stroke-width:24;stroke-linejoin:round;stroke-linecap:round;cursor:pointer;pointer-events:all}.figure-part{fill:#303642;stroke:#697180;stroke-width:2;cursor:pointer;transition:.15s}.figure-part.selected{fill:var(--accent);stroke:#efffb2;filter:drop-shadow(0 0 8px #d9ff4580)}.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:13px}.chip{border:1px solid var(--line);color:#c7ccd5;background:#0e1117;border-radius:99px;padding:8px 11px;font-size:12px}.chip.active{background:var(--accent);border-color:var(--accent);color:#111;font-weight:800}.primary{width:100%;border:0;border-radius:15px;padding:15px;background:var(--accent);color:#0a0b0e;font-weight:900;font-size:16px;box-shadow:0 10px 25px #d9ff4526}.primary:active{transform:scale(.99)}.tabbar{position:fixed;z-index:20;bottom:0;left:50%;transform:translateX(-50%);width:min(620px,100%);height:calc(68px + var(--safe));padding:7px 8px var(--safe);display:grid;grid-template-columns:repeat(4,1fr);background:#11141af2;border-top:1px solid #292e38;backdrop-filter:blur(18px)}.tab{border:0;background:none;color:#777f8e;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10px;font-weight:700}.tab svg{height:24px;width:24px;stroke:currentColor}.tab.active{color:var(--accent)}.toolbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}.iconbtn{border:1px solid var(--line);background:var(--panel);color:#fff;border-radius:11px;width:38px;height:38px;font-size:20px}.month-label{font-size:20px;font-weight:850}.week,.calendar{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}.week div{text-align:center;font-size:10px;color:var(--muted);padding:7px 0}.day{min-height:60px;border:1px solid #222733;border-radius:10px;background:#0d1016;color:#fff;padding:6px;text-align:left}.day.out{opacity:.23}.day.today{border-color:var(--accent)}.day.selected{background:#202530}.day-num{font-size:12px}.dots{display:flex;gap:3px;flex-wrap:wrap;margin-top:8px}.cal-dot{width:7px;height:7px;border-radius:50%}.list{display:flex;flex-direction:column;gap:9px}.log{border:1px solid var(--line);background:#0d1016;border-radius:15px;padding:13px;display:grid;grid-template-columns:5px 1fr auto;gap:11px}.stripe{border-radius:99px}.log-head{font-weight:800;font-size:14px}.log-meta{font-size:11px;color:var(--muted);margin-top:3px}.log-parts{font-size:12px;margin-top:7px;line-height:1.5}.log-note{font-size:12px;color:#bec4ce;margin-top:5px;white-space:pre-wrap}.delete{border:0;background:#251113;color:#ff767b;border-radius:10px;padding:8px;font-size:11px;align-self:start}.empty{text-align:center;color:var(--muted);padding:28px 10px;font-size:13px}.seg{display:grid;grid-template-columns:repeat(3,1fr);background:#0c0f14;border:1px solid var(--line);border-radius:13px;padding:3px;margin-bottom:14px}.seg button{border:0;background:none;color:var(--muted);border-radius:10px;padding:9px 4px;font-size:12px}.seg button.active{background:#2a303b;color:#fff;font-weight:800}.bar-row{margin:14px 0}.bar-label{display:flex;justify-content:space-between;font-size:12px;margin-bottom:6px}.track{height:10px;background:#252a34;border-radius:99px;overflow:hidden}.fill{height:100%;border-radius:99px;min-width:0}.rank-member{margin:18px 0 8px;font-weight:850}.rank-row{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid #242935;font-size:13px}.rank-no{color:var(--muted);width:18px}.rank-count{margin-left:auto;color:var(--muted)}.toast{position:fixed;left:50%;bottom:calc(83px + var(--safe));transform:translate(-50%,20px);background:#f4f6f8;color:#111;padding:11px 18px;border-radius:99px;font-weight:800;font-size:13px;opacity:0;pointer-events:none;transition:.25s;z-index:99}.toast.show{opacity:1;transform:translate(-50%,0)}.date-heading{font-size:15px;font-weight:850;margin:15px 2px 9px}.hint{font-size:11px;color:var(--muted);line-height:1.55;margin-top:8px}.tools{display:grid;grid-template-columns:1fr 1fr;gap:9px}.secondary{border:1px solid var(--line);background:#171b23;color:#fff;border-radius:13px;padding:12px;font-weight:750}.heat-row{display:grid;grid-template-columns:76px 1fr 36px;align-items:center;gap:9px;margin:10px 0;font-size:12px}.heat{height:13px;border-radius:99px;background:#242a34;overflow:hidden}.heat i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,#344027,#d9ff45)}
@media(max-width:370px){.body-wrap{gap:10px}svg{height:390px}.members{gap:5px}.member{font-size:11px}}
</style>
</head>
<body><div class="app">
<header><div class="brand">MAG BALM CARE</div><div class="title" id="pageTitle">施術を記録</div></header>
<main>
<section class="view active" id="recordView">
 <div class="card"><div class="section-title">誰に塗りましたか？</div><div class="members" id="members"></div></div>
 <div class="card"><label for="datetime">施術日時</label><input id="datetime" type="datetime-local"></div>
 <div class="card"><div class="section-title">施術部位を選択</div><div class="body-wrap">
  <div class="body-card"><small>前面</small><svg viewBox="0 0 150 330" role="img" aria-label="人体前面">
   <circle class="figure-part" data-part="頭" cx="75" cy="27" r="19"/><path class="figure-part" data-part="アゴ" d="M60 41 Q75 57 90 41 L87 54 Q75 64 63 54Z"/><rect class="figure-part" data-part="首" x="66" y="56" width="18" height="20" rx="7"/><path class="figure-part" data-part="肩" d="M34 91 Q48 72 67 75 L83 75 Q103 74 116 91 L108 112 L42 112Z"/><path class="figure-part" data-part="背中" d="M51 108 L99 108 L105 180 L45 180Z"/><path class="figure-part" data-part="腰" d="M45 180 L105 180 L103 209 L47 209Z"/><path class="figure-part" data-part="太もも" d="M49 208 L74 208 L70 265 L47 265Z M76 208 L101 208 L103 265 L80 265Z"/><path class="figure-part" data-part="ふくらはぎ" d="M47 263 L70 263 L66 314 L49 314Z M80 263 L103 263 L101 314 L84 314Z"/>
  </svg></div>
  <div class="body-card"><small>背面</small><svg viewBox="0 0 150 330" role="img" aria-label="人体背面">
   <circle class="figure-part" data-part="頭" cx="75" cy="28" r="20"/><rect class="figure-part" data-part="首" x="65" y="54" width="20" height="22" rx="7"/><path class="figure-part" data-part="肩" d="M32 92 Q49 72 66 75 L84 75 Q102 74 118 92 L108 112 L42 112Z"/><path class="figure-part" data-part="肩甲骨" d="M46 108 L73 104 L72 149 L48 155Z M77 104 L104 108 L102 155 L78 149Z"/><path class="figure-part" data-part="背中" d="M48 153 L102 153 L106 184 L44 184Z"/><path class="figure-part" data-part="腰" d="M44 183 L106 183 L103 207 L47 207Z"/><path class="figure-part" data-part="おしり" d="M47 205 Q60 198 74 209 L74 238 Q57 244 47 228Z M76 209 Q90 198 103 205 L103 228 Q93 244 76 238Z"/><path class="figure-part" data-part="太もも" d="M49 236 L73 236 L69 276 L47 276Z M77 236 L101 236 L103 276 L81 276Z"/><path class="figure-part" data-part="ふくらはぎ" d="M47 274 L69 274 L65 315 L49 315Z M81 274 L103 274 L101 315 L85 315Z"/><ellipse class="figure-part" data-part="足の裏" cx="57" cy="322" rx="12" ry="6"/><ellipse class="figure-part" data-part="足の裏" cx="93" cy="322" rx="12" ry="6"/>
  </svg></div></div><div class="chips" id="partChips"></div><div class="hint">人体イラストと部位ボタンは連動します。複数選択できます。</div></div>
 <div class="card"><label for="memo">メモ（任意）</label><textarea id="memo" placeholder="痛み、張り、塗布後の様子など"></textarea></div>
 <button class="primary" id="saveBtn">この内容で保存</button><div class="card" style="margin-top:14px"><div class="section-title">バックアップ</div><div class="tools"><button type="button" class="secondary" id="exportCsv">CSV出力</button><button type="button" class="secondary" id="exportJson">完全バックアップ</button><button type="button" class="secondary" id="importJson">復元</button><button type="button" class="secondary" id="clearAll">全件削除</button></div><input type="file" id="importFile" accept="application/json,.json" hidden><div class="hint">復元には「完全バックアップ」のJSONファイルを使用します。CSVは表計算ソフトでの閲覧用です。</div></div>
</section>
<section class="view" id="calendarView"><div class="card"><div class="toolbar"><button class="iconbtn" id="prevMonth">‹</button><div class="month-label" id="monthLabel"></div><button class="iconbtn" id="nextMonth">›</button></div><div class="week"><div>日</div><div>月</div><div>火</div><div>水</div><div>木</div><div>金</div><div>土</div></div><div class="calendar" id="calendar"></div></div><div class="date-heading" id="selectedDateLabel">日付を選択</div><div class="list" id="dayLogs"></div></section>
<section class="view" id="analysisView"><div class="seg" id="rangeSeg"><button data-range="month" class="active">今月</button><button data-range="year">今年</button><button data-range="all">全期間</button></div><div class="card"><div class="section-title">メンバー別 施術回数</div><div id="memberBars"></div></div><div class="card"><div class="section-title">誰に × どの部位</div><div id="partRanks"></div></div><div class="card"><div class="section-title">部位ヒートマップ</div><div id="heatMap"></div></div></section>
<section class="view" id="historyView"><div class="list" id="historyLogs"></div></section>
</main>
<nav class="tabbar" aria-label="メインメニュー">
 <button class="tab active" data-tab="record"><svg viewBox="0 0 24 24" fill="none" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg><span>記録</span></button>
 <button class="tab" data-tab="calendar"><svg viewBox="0 0 24 24" fill="none" stroke-width="2"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M8 3v4M16 3v4M3 10h18"/></svg><span>カレンダー</span></button>
 <button class="tab" data-tab="analysis"><svg viewBox="0 0 24 24" fill="none" stroke-width="2"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg><span>分析</span></button>
 <button class="tab" data-tab="history"><svg viewBox="0 0 24 24" fill="none" stroke-width="2"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5M12 7v6l4 2"/></svg><span>履歴</span></button>
</nav><div class="toast" id="toast" role="status"></div></div>
<script>
(()=>{'use strict';
const MEMBERS=[['パパ','#2d3748'],['ママ','#e53e3e'],['和真','#3182ce'],['晴人','#38a169'],['実央','#dd6b20']];
const PARTS=['頭','アゴ','首','肩','肩甲骨','背中','腰','おしり','太もも','ふくらはぎ','足の裏'];
const KEY='magBalmCareLogs_v1';
let logs=load(), selectedMember='ママ', selectedParts=new Set(), calCursor=new Date(), selectedDate='', analysisRange='month';
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
function load(){try{const x=JSON.parse(localStorage.getItem(KEY)||'[]');return Array.isArray(x)?x:[]}catch(e){return[]}}
function persist(){localStorage.setItem(KEY,JSON.stringify(logs))}
function localInputValue(d=new Date()){const p=n=>String(n).padStart(2,'0');return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}T${p(d.getHours())}:${p(d.getMinutes())}`}
function dateKey(v){const d=new Date(v),p=n=>String(n).padStart(2,'0');return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}`}
function colorOf(name){return (MEMBERS.find(x=>x[0]===name)||['','#777'])[1]}
function escapeHTML(s=''){return String(s).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
function toast(msg){const t=$('#toast');t.textContent=msg;t.classList.add('show');clearTimeout(t._id);t._id=setTimeout(()=>t.classList.remove('show'),1800)}
function renderMembers(){$('#members').innerHTML=MEMBERS.map(([n,c])=>`<button type="button" class="member ${n===selectedMember?'active':''}" style="--mc:${c}" data-member="${n}"><i class="dot" style="background:${c}"></i>${n}</button>`).join('');$$('[data-member]').forEach(b=>b.onclick=()=>{selectedMember=b.dataset.member;renderMembers()})}
function renderParts(){$('#partChips').innerHTML=PARTS.map(p=>`<button type="button" class="chip ${selectedParts.has(p)?'active':''}" data-chip="${p}">${p}</button>`).join('');$$('[data-chip]').forEach(b=>b.onclick=()=>togglePart(b.dataset.chip));$$('.figure-part').forEach(x=>x.classList.toggle('selected',selectedParts.has(x.dataset.part)))}
function togglePart(p){selectedParts.has(p)?selectedParts.delete(p):selectedParts.add(p);renderParts()}
$$('svg').forEach(svg=>{[...svg.querySelectorAll('.figure-part')].forEach(x=>{const z=x.cloneNode(true);z.removeAttribute('class');z.setAttribute('class','tap-zone');z.setAttribute('aria-label',x.dataset.part+'を選択');svg.appendChild(z)})});
$$('.tap-zone').forEach(x=>x.addEventListener('click',()=>togglePart(x.dataset.part)));
$('#datetime').value=localInputValue();renderMembers();renderParts();
$('#saveBtn').onclick=()=>{const dt=$('#datetime').value;if(!dt)return toast('日時を入力してください');if(!selectedParts.size)return toast('施術部位を選んでください');logs.push({id:Date.now().toString(36)+Math.random().toString(36).slice(2,6),member:selectedMember,datetime:new Date(dt).toISOString(),parts:[...selectedParts],memo:$('#memo').value.trim()});persist();selectedParts.clear();$('#memo').value='';$('#datetime').value=localInputValue();renderParts();toast('記録を保存しました');renderAll()};
function switchTab(tab){$$('.tab').forEach(x=>x.classList.toggle('active',x.dataset.tab===tab));$$('.view').forEach(x=>x.classList.remove('active'));$('#'+tab+'View').classList.add('active');$('#pageTitle').textContent={record:'施術を記録',calendar:'カレンダー',analysis:'ケア分析',history:'施術履歴'}[tab];if(tab==='calendar')renderCalendar();if(tab==='analysis')renderAnalysis();if(tab==='history')renderHistory();scrollTo(0,0)}
$$('.tab').forEach(b=>b.onclick=()=>switchTab(b.dataset.tab));
function logHTML(l){const d=new Date(l.datetime);return `<div class="log"><i class="stripe" style="background:${colorOf(l.member)}"></i><div><div class="log-head">${escapeHTML(l.member)}</div><div class="log-meta">${d.toLocaleDateString('ja-JP')} ${d.toLocaleTimeString('ja-JP',{hour:'2-digit',minute:'2-digit'})}</div><div class="log-parts">${l.parts.map(escapeHTML).join('・')}</div>${l.memo?`<div class="log-note">${escapeHTML(l.memo)}</div>`:''}</div><button type="button" class="delete" data-delete="${l.id}">削除</button></div>`}
function wireDeletes(){$$('[data-delete]').forEach(b=>b.onclick=()=>{if(confirm('この記録を削除しますか？')){logs=logs.filter(x=>x.id!==b.dataset.delete);persist();renderAll();toast('削除しました')}})}
function renderHistory(){const sorted=[...logs].sort((a,b)=>new Date(b.datetime)-new Date(a.datetime));$('#historyLogs').innerHTML=sorted.length?sorted.map(logHTML).join(''):'<div class="empty">まだ記録がありません</div>';wireDeletes()}
function renderCalendar(){const y=calCursor.getFullYear(),m=calCursor.getMonth();$('#monthLabel').textContent=`${y}年 ${m+1}月`;const first=new Date(y,m,1),start=new Date(y,m,1-first.getDay()),today=dateKey(new Date());let out='';for(let i=0;i<42;i++){const d=new Date(start);d.setDate(start.getDate()+i);const k=dateKey(d);const dayMembers=[...new Set(logs.filter(l=>dateKey(l.datetime)===k).map(l=>l.member))];out+=`<button type="button" class="day ${d.getMonth()!==m?'out':''} ${k===today?'today':''} ${k===selectedDate?'selected':''}" data-date="${k}"><span class="day-num">${d.getDate()}</span><span class="dots">${dayMembers.map(n=>`<i class="cal-dot" style="background:${colorOf(n)}"></i>`).join('')}</span></button>`}$('#calendar').innerHTML=out;$$('[data-date]').forEach(b=>b.onclick=()=>{selectedDate=b.dataset.date;renderCalendar();renderDayLogs()});renderDayLogs()}
function renderDayLogs(){if(!selectedDate){$('#selectedDateLabel').textContent='日付を選択';$('#dayLogs').innerHTML='<div class="empty">日付をタップすると詳細を表示します</div>';return}const [y,m,d]=selectedDate.split('-');$('#selectedDateLabel').textContent=`${y}年${+m}月${+d}日の記録`;const list=logs.filter(l=>dateKey(l.datetime)===selectedDate).sort((a,b)=>new Date(b.datetime)-new Date(a.datetime));$('#dayLogs').innerHTML=list.length?list.map(logHTML).join(''):'<div class="empty">この日の記録はありません</div>';wireDeletes()}
$('#prevMonth').onclick=()=>{calCursor=new Date(calCursor.getFullYear(),calCursor.getMonth()-1,1);selectedDate='';renderCalendar()};$('#nextMonth').onclick=()=>{calCursor=new Date(calCursor.getFullYear(),calCursor.getMonth()+1,1);selectedDate='';renderCalendar()};
function filteredLogs(){const now=new Date();return logs.filter(l=>{const d=new Date(l.datetime);if(analysisRange==='month')return d.getFullYear()===now.getFullYear()&&d.getMonth()===now.getMonth();if(analysisRange==='year')return d.getFullYear()===now.getFullYear();return true})}
function renderAnalysis(){const f=filteredLogs();const counts=Object.fromEntries(MEMBERS.map(([n])=>[n,f.filter(l=>l.member===n).length]));const max=Math.max(1,...Object.values(counts));$('#memberBars').innerHTML=MEMBERS.map(([n,c])=>`<div class="bar-row"><div class="bar-label"><b>${n}</b><span>${counts[n]}回</span></div><div class="track"><div class="fill" style="width:${counts[n]/max*100}%;background:${c}"></div></div></div>`).join('');let ranks='';MEMBERS.forEach(([n,c])=>{const pc={};f.filter(l=>l.member===n).forEach(l=>l.parts.forEach(p=>pc[p]=(pc[p]||0)+1));const arr=Object.entries(pc).sort((a,b)=>b[1]-a[1]);ranks+=`<div class="rank-member" style="color:${c}">${n}</div>`+(arr.length?arr.map(([p,v],i)=>`<div class="rank-row"><span class="rank-no">${i+1}</span><b>${p}</b><span class="rank-count">${v}回</span></div>`).join(''):'<div class="hint">記録なし</div>')});$('#partRanks').innerHTML=ranks;const totals={};f.forEach(l=>l.parts.forEach(p=>totals[p]=(totals[p]||0)+1));const hmax=Math.max(1,...Object.values(totals));$('#heatMap').innerHTML=PARTS.map(p=>`<div class="heat-row"><b>${p}</b><div class="heat"><i style="width:${(totals[p]||0)/hmax*100}%"></i></div><span>${totals[p]||0}回</span></div>`).join('')}
$$('#rangeSeg button').forEach(b=>b.onclick=()=>{analysisRange=b.dataset.range;$$('#rangeSeg button').forEach(x=>x.classList.toggle('active',x===b));renderAnalysis()});

function download(name,type,text){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type}));a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},500)}
$('#exportCsv').onclick=()=>{const q=v=>'"'+String(v??'').replace(/"/g,'""')+'"';const rows=[['日時','対象者','部位','メモ'],...[...logs].sort((a,b)=>new Date(a.datetime)-new Date(b.datetime)).map(l=>[new Date(l.datetime).toLocaleString('ja-JP'),l.member,l.parts.join('・'),l.memo])];download('mag-balm-records.csv','text/csv;charset=utf-8','\ufeff'+rows.map(r=>r.map(q).join(',')).join('\r\n'));toast('CSVを書き出しました')};
$('#exportJson').onclick=()=>{download('mag-balm-backup.json','application/json',JSON.stringify({app:'MAG BALM CARE',version:2,exportedAt:new Date().toISOString(),logs},null,2));toast('バックアップを保存しました')};
$('#importJson').onclick=()=>$('#importFile').click();
$('#importFile').onchange=async e=>{try{const data=JSON.parse(await e.target.files[0].text());const incoming=Array.isArray(data)?data:data.logs;if(!Array.isArray(incoming))throw Error();if(!confirm(`${incoming.length}件の記録で現在のデータを置き換えますか？`))return;logs=incoming;persist();renderAll();toast('記録を復元しました')}catch(err){toast('対応したJSONではありません')}finally{e.target.value=''}};
$('#clearAll').onclick=()=>{if(logs.length&&confirm('すべての記録を削除しますか？この操作は元に戻せません。')){logs=[];persist();renderAll();toast('全記録を削除しました')}};
if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}))}

function renderAll(){renderHistory();renderCalendar();renderAnalysis()}
renderAll();
})();
</script></body></html>
